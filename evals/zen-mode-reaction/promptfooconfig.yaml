description: "zen-mode model-reaction eval (contract compliance, precedence over a compression mode, the never-compress safety carve-out, the rule-6 chain-progress anchor, that anchor's failed-and-omitted half, and the short body every later prompt of a context generation carries, graded standing alone on contract compliance, the safety carve-out and the anchor). Grades how the model REACTS to the injected zen-mode contract."

providers:
  - id: 'exec: node native-provider.js'
    config:
      working_dir: ./test-projects/empty-host

prompts:
  - id: zen-mode-reaction
    label: "zen-mode reaction probe (simulated injected contract + task)"
    raw: |
      {{spec_block}}

defaultTest:
  options:
    transform: |
      return typeof output === 'string' ? output : JSON.stringify(output);
  assert:
    - type: javascript
      value: |
        const text = String(output);
        const ok = text.includes('[native_verified_prose]') && !/LIVE-(SKIPPED|UNAVAILABLE|INCONCLUSIVE)/.test(text);
        return {pass: ok, score: ok ? 1 : 0, reason: ok ? 'Observed nonempty native model response' : 'No verified model response; absence assertions are not graded'};

tests:
  - file://scenarios/contract-compliance.yaml
  - file://scenarios/precedence-over-compression.yaml
  - file://scenarios/safety-carve-out.yaml
  - file://scenarios/anchor-multi-step.yaml
  - file://scenarios/anchor-failed-step.yaml
  - file://scenarios/short-contract-compliance.yaml
  - file://scenarios/short-safety-carve-out.yaml
  - file://scenarios/short-anchor-multi-step.yaml

evaluateOptions:
  maxConcurrency: 2
  repeat: 3
