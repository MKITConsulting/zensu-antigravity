- description: 'traceability: the TDD skill defines the stable requirement-ID format'
  vars:
    scenario_id: trace-tdd-declares-requirement-ids
    kind: shell
    script: |
      grep -rhoE 'AC-###|FR-###' "$ZENSU_PLUGIN_ROOT/skills/tdd" | sort -u
    expect:
      exit_code: 0
      contains:
        - AC-###
        - FR-###
- description: 'traceability: the plan template ships the Requirements table the chain anchors on'
  vars:
    scenario_id: trace-template-has-requirements-table
    kind: shell
    script: |
      grep -E '^## Requirements|Covers' "$ZENSU_PLUGIN_ROOT/templates/tdd-plan.md" | head -5
    expect:
      exit_code: 0
      contains:
        - '## Requirements'
        - Covers
- description: 'traceability: autopilot carries the same requirement IDs end to end'
  vars:
    scenario_id: trace-autopilot-requirement-ids
    kind: shell
    script: |
      grep -cE 'AC-|FR-' "$ZENSU_PLUGIN_ROOT/skills/autopilot/SKILL.md"
    expect:
      exit_code: 0
      not_matches:
        - ^0$
- description: 'review chain: the judge stage sits between the merged panel and the consolidating reviewer'
  vars:
    scenario_id: chain-judge-stage-wired
    kind: shell
    script: |
      grep -rhoE 'zensu-review-judge|reviewJudge|Panel-FP' "$ZENSU_PLUGIN_ROOT/skills/tdd" | sort -u
    expect:
      exit_code: 0
      contains:
        - zensu-review-judge
        - reviewJudge
- description: 'review chain: the judge agent is read-only'
  vars:
    scenario_id: chain-judge-is-read-only
    kind: shell
    script: |
      awk '/^---$/{c++; next} c==1' "$ZENSU_PLUGIN_ROOT/agents/zensu-review-judge.md" | grep -iE '^tools:'
    expect:
      exit_code: 0
      not_matches:
        - write|edit|replace_file
- description: 'skill artifact contract: overlay-missing-is-noop'
  vars:
    scenario_id: overlay-missing-is-noop
    kind: shell
    script: >
      node -e 'const fs=require("fs"),p=require("path"),root=process.env.ZENSU_PLUGIN_ROOT;const
      text=fs.readFileSync(p.join(root,"skills/tdd/SKILL.md"),"utf8");for(const needle of ["Missing or empty
      file = no-op"])if(!text.includes(needle))throw Error("missing guidance:
      "+needle);console.log("OPTIONAL_OVERLAY_CONFIRMED");'
    expect:
      exit_code: 0
      contains:
        - OPTIONAL_OVERLAY_CONFIRMED
- description: 'skill artifact contract: overlay-present-is-contract-wrapped'
  vars:
    scenario_id: overlay-present-is-contract-wrapped
    kind: shell
    script: >
      node -e 'const fs=require("fs"),p=require("path"),root=process.env.ZENSU_PLUGIN_ROOT;const
      text=fs.readFileSync(p.join(root,"skills/tdd/SKILL.md"),"utf8");for(const needle of ["additive-only",
      "NEVER disable", "On any conflict the skill text wins"])if(!text.includes(needle))throw Error("missing
      guidance: "+needle);console.log("ADDITIVE_CONTRACT_CONFIRMED");'
    expect:
      exit_code: 0
      contains:
        - ADDITIVE_CONTRACT_CONFIRMED
- description: 'skill artifact contract: overlay-traversal-name-refused'
  vars:
    scenario_id: overlay-traversal-name-refused
    kind: shell
    script: >
      node -e 'const fs=require("fs"),p=require("path"),root=process.env.ZENSU_PLUGIN_ROOT;const
      text=fs.readFileSync(p.join(root,"skills/tdd/SKILL.md"),"utf8");for(const needle of
      [".zensu/overlays/tdd.md"])if(!text.includes(needle))throw Error("missing guidance:
      "+needle);console.log("FIXED_OVERLAY_PATH_CONFIRMED");'
