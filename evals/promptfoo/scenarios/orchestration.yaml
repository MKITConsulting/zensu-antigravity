- description: 'session state: a fresh baseline is inactive with no review debt'
  vars:
    scenario_id: session-baseline-inactive
    kind: shell
    script: >
      node -e 'const
      assert=require("assert/strict"),core=require(process.env.ZENSU_PLUGIN_ROOT+"/hooks/lib/session-control-core-v1.js"),state=core.readWorkflowState({projectRoot:process.env.ZENSU_PROJECT_DIR,sessionId:process.env.ZENSU_HOST_SESSION_ID});assert.equal(state.active,false);console.log("INACTIVE_BASELINE");'
    expect:
      exit_code: 0
      contains:
        - INACTIVE_BASELINE
    bind_session: true
    session_id: pf-ledger
- description: 'session state: ambient retired state directories cannot replace the private binding'
  vars:
    scenario_id: session-legacy-override-ignored
    kind: shell
    script: |
      before="$ZENSU_PROJECT_ROOT"
      export TDD_STATE_DIR="__DATA__/foreign" ZENSU_PLUGIN_DATA_OVERRIDE="__DATA__/foreign"
      . "$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-tdd-phase.sh"
      actual="$(tdd_state_file "$ZENSU_HOST_SESSION_ID")" || exit $?
      case "$actual" in "$before"/.zensu/state/*) echo BOUND_STATE_PRESERVED;; *) exit 1;; esac
    expect:
      exit_code: 0
      contains:
        - BOUND_STATE_PRESERVED
    bind_session: true
    session_id: pf-ledger
- description: 'project dir: an explicit project dir always wins unchanged'
  vars:
    scenario_id: projectdir-explicit-wins
    kind: shell
    script: |
      actual="$(zensu_resolve_project_dir)" || exit $?
      [ "$actual" = "$ZENSU_PROJECT_ROOT" ] && echo MATCHES_BOUND_ROOT
    expect:
      exit_code: 0
      contains:
        - MATCHES_BOUND_ROOT
    bind_session: true
- description: 'project dir: resolution is cwd-independent inside the project'
  vars:
    scenario_id: projectdir-subdirectory-stable
    kind: shell
    script: |
      mkdir -p "$ZENSU_PROJECT_DIR/deep/nested"
      root="$(zensu_resolve_project_dir)"
      nested="$(cd "$ZENSU_PROJECT_DIR/deep/nested" && zensu_resolve_project_dir)"
      [ "$root" = "$nested" ] && echo STABLE
    expect:
      exit_code: 0
      contains:
        - STABLE
    bind_session: true
- description: 'project dir: caller environment cannot select a different immutable root'
  vars:
    scenario_id: projectdir-ambient-selector-ignored
    kind: shell
    script: |
      before="$ZENSU_PROJECT_ROOT"
      mkdir -p "__HOME__/foreign"
      export ZENSU_PROJECT_DIR="__HOME__/foreign"
      zensu_bind_model_session || exit $?
      [ "$ZENSU_PROJECT_ROOT" = "$before" ] && echo BOUND_ROOT_PRESERVED
    expect:
      exit_code: 0
      contains:
        - BOUND_ROOT_PRESERVED
    bind_session: true
- description: 'runtime binding: unchanged content preserves the pinned digest'
  vars:
    scenario_id: binding-runtime-digest-stable
    kind: shell
    script: |
      first="$ZENSU_RUNTIME_DIGEST"
      zensu_bind_model_session || exit $?
      [ "$first" = "$ZENSU_RUNTIME_DIGEST" ] && [ ${#first} -ge 64 ] && echo DIGEST_STABLE
    expect:
      exit_code: 0
      contains:
        - DIGEST_STABLE
    bind_session: true
- description: 'runtime binding: a different raw host conversation cannot reuse this session'
  vars:
    scenario_id: binding-session-impersonation-refused
    kind: shell
    script: |
      export ZENSU_HOST_SESSION_ID=foreign-conversation
      zensu_bind_model_session >/dev/null 2>&1
      [ "$?" -ne 0 ] && echo FOREIGN_SESSION_REFUSED
    expect:
      exit_code: 0
      contains:
        - FOREIGN_SESSION_REFUSED
    bind_session: true
