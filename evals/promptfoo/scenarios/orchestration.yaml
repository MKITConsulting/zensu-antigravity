- description: 'skill artifact contract: template-default-resolves'
  vars:
    scenario_id: template-default-resolves
    kind: shell
    script: >
      node -e 'const fs=require("fs"),p=require("path"),root=process.env.ZENSU_PLUGIN_ROOT;const
      text=fs.readFileSync(p.join(root,"skills/tdd/references/planning.md"),"utf8");for(const needle of
