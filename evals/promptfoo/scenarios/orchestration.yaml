- description: 'skill artifact contract: template-repo-override-wins'
  vars:
    scenario_id: template-repo-override-wins
    kind: shell
    script: >
      node -e 'const fs=require("fs"),p=require("path"),root=process.env.ZENSU_PLUGIN_ROOT;const
      text=fs.readFileSync(p.join(root,"skills/tdd/references/planning.md"),"utf8");for(const needle of
      [".zensu/templates/"])if(!text.includes(needle))throw Error("missing guidance:
      "+needle);console.log("REPO_TEMPLATE_CONTRACT_CONFIRMED");'
    expect:
      exit_code: 0
      contains:
        - REPO_TEMPLATE_CONTRACT_CONFIRMED
- description: 'personas: no repo personas means no extra reviewers'
  vars:
    scenario_id: persona-none-configured
    kind: shell
    script: >
      printf 'src/app.ts\n' | node "$ZENSU_PLUGIN_ROOT/hooks/lib/persona-activation.js"
      "$ZENSU_PROJECT_DIR/.zensu/agents"

      echo "rc=$?"
    expect:
      contains:
        - rc=0
      not_contains:
        - 'spawn '
- description: 'personas: a matching repo persona is spawned, a non-matching one is skipped'
  vars:
    scenario_id: persona-activation-matches
    kind: shell
    script: >
      D="$ZENSU_PROJECT_DIR/.zensu/agents"; mkdir -p "$D"

      printf -- '---\nname: zensu-review-frontend\nactivation: "src/**/*.tsx"\n---\nFrontend review.\n' >
      "$D/zensu-review-frontend.md"

      printf -- '---\nname: zensu-review-infra\nactivation: "terraform/**"\n---\nInfra review.\n' >
      "$D/zensu-review-infra.md"

      printf 'src/App.tsx\n' | node "$ZENSU_PLUGIN_ROOT/hooks/lib/persona-activation.js" "$D"
    expect:
      exit_code: 0
      contains:
        - zensu-review-frontend
      not_matches:
        - spawn zensu-review-infra
- description: 'autopilot state: a run round-trips through the durable store'
  vars:
    scenario_id: autopilot-state-round-trip
    kind: shell
    script: |
      . "$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-autopilot-state.sh"
      autopilot_begin_run pf-auto "$ZENSU_SESSION_KEY" "$ZENSU_PROJECT_DIR" >/dev/null || exit $?
      autopilot_read_run pf-auto "$ZENSU_PROJECT_DIR"
    expect:
      exit_code: 0
      stdout_json:
        stage: PLANNING
        runId: pf-auto
    bind_session: true
    session_id: pf-auto
- description: 'autopilot state: corrupt state is refused without replacing it'
  vars:
    scenario_id: autopilot-state-corrupt-fails-closed
    kind: shell
    script: |
      . "$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-autopilot-state.sh"
      autopilot_begin_run pf-auto "$ZENSU_SESSION_KEY" "$ZENSU_PROJECT_DIR" >/dev/null || exit $?
      F="$(autopilot_run_file pf-auto "$ZENSU_PROJECT_DIR")"
      printf "{ corrupt" > "$F"
      autopilot_read_run pf-auto "$ZENSU_PROJECT_DIR" >/dev/null 2>&1
      echo "rc=$?"
      cat "$F"
    expect:
      contains:
        - rc=2
        - '{ corrupt'
    bind_session: true
    session_id: pf-auto
- description: 'autopilot state: concurrent retries commit one idempotent event'
  vars:
    scenario_id: autopilot-state-concurrent-writes-all-land
    kind: shell
    script: >
      . "$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-autopilot-state.sh"

      autopilot_begin_run pf-auto "$ZENSU_SESSION_KEY" "$ZENSU_PROJECT_DIR" >/dev/null || exit $?

      for i in $(seq 1 8); do
        (
          for attempt in 1 2 3 4; do
            autopilot_apply_event pf-auto identical-plan PLAN_APPROVED '{"approvedPlanSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' "$ZENSU_PROJECT_DIR" "$ZENSU_SESSION_KEY" >"__HOME__/out-$i" 2>"__HOME__/err-$i"
            rc=$?
            [ "$rc" -eq 1 ] && [ "$attempt" -lt 4 ] || break
            node -e 'const fs=require("fs"),p=require("path"),lines=fs.readFileSync(process.argv[1],"utf8").trim().split(/\r?\n/),resource=p.join(fs.realpathSync(process.env.ZENSU_PROJECT_DIR),".zensu/state/autopilot");process.exit(lines.length===2&&lines[0]==="[zensu-tdd-phase] lock detail: session-control-v1: timed out acquiring external process lock"&&lines[1]==="[zensu-tdd-phase] lock acquisition failed for "+resource?0:1)' "__HOME__/err-$i" || break
            cat "__HOME__/err-$i" >>"__HOME__/transient-lock-$i"
          done
          echo "$rc" >"__HOME__/rc-$i"
        ) &
      done

      wait

      node -e 'const fs=require("fs"),p=require("path"),home=process.env.HOME;for(let
      i=1;i<=8;i++){if(fs.readFileSync(p.join(home,"rc-"+i),"utf8").trim()!=="0"){process.stderr.write("worker
      "+i+" failed:
      "+fs.readFileSync(p.join(home,"err-"+i),"utf8"));process.exit(1)};if(fs.readFileSync(p.join(home,"err-"+i),"utf8"))throw
      Error("stderr noise");}const
      state=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(state.events.filter(e=>e.eventId==="identical-plan").length!==1)throw
      Error("duplicate event");console.log("ONE_EVENT EIGHT_SUCCESSFUL_WORKERS STDERR_CLEAN");'
      "$(autopilot_run_file pf-auto "$ZENSU_PROJECT_DIR")"
    expect:
      exit_code: 0
      contains:
        - ONE_EVENT EIGHT_SUCCESSFUL_WORKERS STDERR_CLEAN
    bind_session: true
    session_id: pf-auto
- description: 'autopilot state: a live external lease excludes another owner'
  vars:
    scenario_id: autopilot-state-live-lease-exclusive
    kind: shell
    script: >
      node -e '

      const
      assert=require("assert/strict"),path=require("path"),core=require(path.join(process.env.ZENSU_PLUGIN_ROOT,"hooks/lib/session-control-core-v1.js"));

      const
      lockDirectory=path.join(process.env.ZENSU_PROJECT_DIR,".zensu/state");require("fs").mkdirSync(lockDirectory,{recursive:true});

      const options={lockDirectory,resourcePath:path.join(lockDirectory,"autopilot"),ownerPid:process.pid};

      const lease=core.acquireExternalProcessLock(options);

      try
      {assert.throws(()=>core.acquireExternalProcessLock(options));console.log("LIVE_OWNER_KEPT");}finally{core.releaseExternalProcessLock({...options,token:lease.token});}

      const
      next=core.acquireExternalProcessLock(options);core.releaseExternalProcessLock({...options,token:next.token});console.log("RELEASED_LEASE_REUSABLE");'
    expect:
      exit_code: 0
      contains:
        - LIVE_OWNER_KEPT
        - RELEASED_LEASE_REUSABLE
    bind_session: true
    session_id: pf-auto
