# The strict TDD phase gate, proven phase by phase through the Antigravity
# writer tools. Strict mode is opt-in (hooks.tddImplementation), so every strict
# scenario ships that config; the vanilla scenarios prove the gate stays out of
# the way when it is off.

- description: "phase gate RED_WRITE: authoring the failing test is allowed"
  vars:
    scenario_id: phase-red-write-allows-test
    kind: hook
    hook: pre-edit-tdd-reminder.sh
    env: &strict_env { ZENSU_AG_HOOK_CONTRACT: superset, TDD_STATE_DIR: "__DATA__/tdd" }
    config: &strict_config { hooks: { tddImplementation: true } }
    setup: &arm_red_write |
      LOG="$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-log.sh"
      mkdir -p "$TDD_STATE_DIR"
      bash "$LOG" --tdd-begin --session pf-phase >/dev/null 2>&1 || true
      bash "$LOG" --phase RED_WRITE --step s1 --session pf-phase >/dev/null 2>&1 || true
    payload: &write_test
      toolCall:
        name: write_to_file
        args: { TargetFile: "__PROJECT__/src/app.test.ts", CodeContent: "test('x', () => {})" }
      workspacePaths: ["__PROJECT__"]
      session_id: pf-phase
    expect:
      exit_code: 0
      stdout_not_contains: ["deny_reason"]

- description: "phase gate RED_RUN: nothing may be edited while the test is being run"
  vars:
    scenario_id: phase-red-run-freezes-edits
    kind: hook
    hook: pre-edit-tdd-reminder.sh
    env: *strict_env
    config: *strict_config
    setup: |
      LOG="$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-log.sh"
      mkdir -p "$TDD_STATE_DIR"
      bash "$LOG" --tdd-begin --session pf-phase >/dev/null 2>&1 || true
      bash "$LOG" --phase RED_RUN --step s1 --session pf-phase >/dev/null 2>&1 || true
    payload: *write_test
    expect:
      exit_code: 0
      stdout_json: { allow_tool: false }
      contains: ["RED_RUN"]

- description: "phase gate RED_FAIL: production code stays frozen until IMPL is entered"
  vars:
    scenario_id: phase-red-fail-denies-production
    kind: hook
    hook: pre-edit-tdd-reminder.sh
    env: *strict_env
    config: *strict_config
    setup: &arm_red_fail |
      LOG="$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-log.sh"
      mkdir -p "$TDD_STATE_DIR"
      bash "$LOG" --tdd-begin --session pf-phase >/dev/null 2>&1 || true
      bash "$LOG" --phase RED_WRITE --step s1 --session pf-phase >/dev/null 2>&1 || true
      bash "$LOG" --phase RED_RUN --step s1 --session pf-phase >/dev/null 2>&1 || true
      bash "$LOG" --phase RED_FAIL --step s1 --session pf-phase --reason "expected failure" >/dev/null 2>&1 || true
    payload: &write_production
      toolCall:
        name: write_to_file
        args: { TargetFile: "__PROJECT__/src/app.ts", CodeContent: "export const a = 1" }
      workspacePaths: ["__PROJECT__"]
      session_id: pf-phase
    expect:
      exit_code: 0
      stdout_json: { allow_tool: false }

- description: "phase gate RED_FAIL: the test itself may still be corrected"
  vars:
    scenario_id: phase-red-fail-allows-test
    kind: hook
    hook: pre-edit-tdd-reminder.sh
    env: *strict_env
    config: *strict_config
    setup: *arm_red_fail
    payload: *write_test
    expect:
      exit_code: 0
      stdout_not_contains: ["deny_reason"]

