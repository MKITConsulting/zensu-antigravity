- description: 'phase gate RED_WRITE: authoring the failing test is allowed'
  vars:
    scenario_id: phase-red-write-allows-test
    kind: hook
    hook: pre-edit-tdd-reminder.sh
    config:
      hooks:
        tddImplementation: true
    setup: |
      LOG="$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-log.sh"
      . "$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-session.sh"
      zensu_bind_model_session || exit $?
      . "$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-tdd-phase.sh"
      bash "$LOG" --tdd-begin --session pf-phase >/dev/null 2>&1 || exit $?
      tdd_write_phase pf-phase s1 RED_WRITE "fixture phase" >/dev/null || exit $?
    payload:
      toolCall:
        name: write_to_file
        args:
          TargetFile: __PROJECT__/src/app.test.ts
          CodeContent: test('x', () => {})
      workspacePaths:
        - __PROJECT__
      session_id: pf-phase
    expect:
      exit_code: 0
      stdout_not_contains:
        - deny_reason
        - '"allow"'
        - '"deny"'
      stdout_json:
        decision: ask
