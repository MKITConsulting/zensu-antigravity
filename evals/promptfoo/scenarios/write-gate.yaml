- description: "write-gate: free-standing security classification is denied"
  vars:
    scenario_id: write-gate-classify-denied
    kind: hook
    hook: pre-bash-zensu-gate.sh
    env: { ZENSU_AG_HOOK_CONTRACT: superset }
    payload:
      toolCall:
        name: run_command
        args:
          CommandLine: "zensu security classify f1 --classification confidential"
          Cwd: "__PROJECT__"
      workspacePaths: ["__PROJECT__"]
      session_id: pf-write-gate
    expect:
      exit_code: 0
      stdout_json: { allow_tool: false }
      contains: ["set_security_classification"]

