- description: "write-gate: a write tool call is not a shell call and is left alone"
  vars:
    scenario_id: write-gate-ignores-write-tool
    kind: hook
    hook: pre-bash-zensu-gate.sh
    env: { ZENSU_AG_HOOK_CONTRACT: superset }
    payload:
      toolCall:
        name: write_to_file
        args: { TargetFile: "__PROJECT__/notes.md", CodeContent: "zensu features create" }
      workspacePaths: ["__PROJECT__"]
      session_id: pf-write-gate
    expect:
      exit_code: 0
      stdout_not_contains: ["deny_reason"]
