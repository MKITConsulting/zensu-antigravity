- description: "write-gate: read verb passes ungated"
  vars:
    scenario_id: write-gate-read-allowed
    kind: hook
    hook: pre-bash-zensu-gate.sh
    env: { ZENSU_AG_HOOK_CONTRACT: superset }
    payload:
      toolCall:
        name: run_command
        args: { CommandLine: "zensu features get f1", Cwd: "__PROJECT__" }
      workspacePaths: ["__PROJECT__"]
      session_id: pf-write-gate
    expect:
      exit_code: 0
      stdout_not_contains: ["allow_tool", "deny_reason"]

