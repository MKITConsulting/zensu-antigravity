- description: 'secret scan: a benign source write is untouched'
  vars:
    scenario_id: secret-benign-write-allowed
    kind: hook
    hook: pre-write-secret-scan.sh
    env: {}
    payload:
      toolCall:
        name: write_to_file
        args:
          TargetFile: __PROJECT__/src/config.ts
          CodeContent: export const region = 'eu-central-1';
      workspacePaths:
        - __PROJECT__
      session_id: pf-secret
    expect:
      exit_code: 0
      stdout_not_contains:
        - deny_reason
        - '"allow"'
        - '"deny"'
      stdout_json:
        decision: ask
- description: 'secret scan: an AWS-shaped access key in a write is denied'
  vars:
    scenario_id: secret-aws-key-denied
