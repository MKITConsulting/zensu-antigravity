- description: 'unbound tool call: malformed or empty authority fails closed'
  vars:
    scenario_id: secret-malformed-fails-closed
    kind: hook
    hook: pre-write-secret-scan.sh
    env: {}
    payload: '{ broken'
    expect:
      exit_code: 0
      stdout_json:
        decision: deny
      contains:
        - conversation
- description: 'secret scan: the shim normalizes the writer body so the scan is not a no-op'
  vars:
    scenario_id: secret-shim-normalizes-content
    kind: shell
    script: >
      printf
      '{"toolCall":{"name":"write_to_file","args":{"TargetFile":"__PROJECT__/a.ts","CodeContent":"MARKER_BODY_TEXT"}},"workspacePaths":["__PROJECT__"]}'
      \
        | node "$ZENSU_PLUGIN_ROOT/hooks/antigravity/normalize-payload.js"
    expect:
      exit_code: 0
      contains:
        - MARKER_BODY_TEXT
- description: 'secret scan: a credential smuggled through a raw shell write is denied'
  vars:
    scenario_id: secret-raw-shell-write-denied
    kind: shell
    script: |
      BODY='printf "AKIA2X4QZ7B9KLMNPQRS" > __PROJECT__/leak.env'
      node -e '
        const payload = {
          tool_name: "Bash",
          tool_input: { command: process.argv[1] },
          cwd: process.env.ZENSU_PROJECT_DIR,
          session_id: "pf-secret"
        };
        process.stdout.write(JSON.stringify(payload));
      ' "$BODY" | bash "$ZENSU_PLUGIN_ROOT/hooks/pre-write-secret-scan.sh"
    expect:
      matches:
        - deny|blocked|secret|credential
    bind_session: true
    session_id: pf-secret
