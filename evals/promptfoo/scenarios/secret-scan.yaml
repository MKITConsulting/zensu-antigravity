- description: 'secret scan: the documented off-switch releases the gate'
  vars:
    scenario_id: secret-off-switch-bypasses
    kind: hook
    hook: pre-write-secret-scan.sh
    env:
      ZENSU_SECRET_SCAN: 'off'
    payload:
      toolCall:
        name: write_to_file
        args:
          TargetFile: __PROJECT__/src/config.ts
          CodeContent: export const key = 'AKIA2X4QZ7B9KLMNPQRS';
      workspacePaths:
