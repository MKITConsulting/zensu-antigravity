- description: 'stop chain: an idle session is allowed to end its turn'
  vars:
    scenario_id: stop-chain-idle-session-passes
    kind: hook
    hook: stop-chain-enforcer.sh
    payload:
      workspacePaths:
      - __PROJECT__
      session_id: pf-stop
    expect:
      exit_code: 0
      stdout_contains:
      - '{}'
      stdout_not_contains:
      - '"decision"'
      - block
- description: 'stop chain: finishing implementation without the review chain blocks the stop'
  vars:
    scenario_id: stop-chain-unreviewed-implementation-blocks
    kind: hook
    hook: stop-chain-enforcer.sh
    setup: 'LOG="$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-log.sh"

      bash "$LOG" --tdd-begin --session pf-stop >/dev/null 2>&1 || exit $?

      bash "$LOG" --tdd-complete --session pf-stop >/dev/null 2>&1 || exit $?

      '
    payload:
      workspacePaths:
      - __PROJECT__
      session_id: pf-stop
    expect:
      exit_code: 0
      stdout_json:
        decision: continue
      contains:
      - review chain is still open
      - native delegated review phase
      - --review-ticket
- description: 'stop chain: the rendered block requires native children and verified completion'
  vars:
    scenario_id: stop-chain-block-names-antigravity
    kind: hook
    hook: stop-chain-enforcer.sh
    setup: 'LOG="$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-log.sh"

      bash "$LOG" --tdd-begin --session pf-stop >/dev/null 2>&1 || exit $?

      bash "$LOG" --tdd-complete --session pf-stop >/dev/null 2>&1 || exit $?

      '
    payload:
      workspacePaths:
      - __PROJECT__
      session_id: pf-stop
    expect:
      exit_code: 0
      contains:
      - native delegated review phase
      - real invoke_subagent tool
      - keep raw child findings immutable
      - Never fabricate child metadata or close an unreviewed chain.
      not_contains:
      - Claude
      - spawn an Agent
      - in this thread
- description: 'stop chain: a completed chain releases the stop'
  vars:
    scenario_id: stop-chain-completed-chain-releases
    kind: hook
    hook: stop-chain-enforcer.sh
    setup: 'LOG="$ZENSU_PLUGIN_ROOT/hooks/lib/zensu-log.sh"

      bash "$LOG" --tdd-begin --session pf-stop >/dev/null || exit $?

      bash "$LOG" --tdd-complete --session pf-stop >/dev/null || exit $?

      # No source changes: the canonical zero-change closure is permitted.

      bash "$LOG" --chain-done --session pf-stop >/dev/null || exit $?

      '
    payload:
      workspacePaths:
      - __PROJECT__
      session_id: pf-stop
    expect:
      exit_code: 0
      stdout_contains:
      - '{}'
      stdout_not_contains:
      - '"decision"'
      - '"decision":"block"'
      - '"allow_tool"'
- description: 'stop chain: the enforcer never crashes the host on a malformed payload'
  vars:
    scenario_id: stop-chain-malformed-payload-fails-open
    kind: hook
    hook: stop-chain-enforcer.sh
    payload: '}{ not json'
    expect:
      exit_code: 0
