- description: 'host contract: agy''s conversationId becomes the session id every hook agrees on'
  vars:
    scenario_id: host-contract-conversationid-is-session-id
    kind: shell
    script: "for shape in \\\n  '{\"conversationId\":\"conv-42\",\"invocationNum\":0}' \\\n  '{\"conversationId\"\
      :\"conv-42\",\"toolCall\":{\"name\":\"run_command\",\"args\":{\"CommandLine\":\"ls\"}}}' \\\n  '{\"conversationId\"\
      :\"conv-42\",\"executionNum\":1,\"terminationReason\":\"model_stop\"}'\ndo\n  printf '%s' \"$shape\" | node\
      \ \"$ZENSU_PLUGIN_ROOT/hooks/antigravity/normalize-payload.js\" | sed -n '2p' \\\n    | node -e 'let s=\"\"\
      ;process.stdin.on(\"data\",c=>s+=c).on(\"end\",()=>{try{const v=JSON.parse(s).session_id;process.stdout.write((v?\"\
      RESOLVED \"+v:\"MISSING\")+\"\\n\")}catch(_){process.stdout.write(\"PARSE-FAIL\\n\")}})'\ndone\n"
    expect:
      exit_code: 0
      stdout_contains:
      - 'RESOLVED conv-42

        RESOLVED conv-42

        RESOLVED conv-42'
      stdout_not_contains:
      - PARSE-FAIL
      - MISSING
- description: 'host contract: native conversation identity outranks compatibility aliases'
  vars:
    scenario_id: host-contract-conversation-id-outranks-alias
    kind: shell
    script: "printf '%s' '{\"session_id\":\"explicit\",\"conversationId\":\"conv-42\"}' \\\n  | node \"$ZENSU_PLUGIN_ROOT/hooks/antigravity/normalize-payload.js\"\
      \ | sed -n '2p'\n"
    expect:
      exit_code: 0
      stdout_contains:
      - '"session_id":"conv-42"'
      stdout_not_contains:
      - explicit
- description: 'host contract: the retired allow_tool/deny_reason dialect is gone from every event'
  vars:
    scenario_id: host-contract-retired-dialect-gone
    kind: shell
    script: "for ev in PreToolUse PostToolUse PreInvocation PostInvocation Stop; do\n  for role in deny block context;\
      \ do\n    ZV_EVENT=\"$ev\" ZV_ROLE=\"$role\" ZV_TEXT=\"t\" node \"$ZENSU_PLUGIN_ROOT/hooks/antigravity/emit-verdict.js\"\
      \n    printf '\\n'\n  done\ndone\n"
    expect:
      exit_code: 0
      stdout_contains:
      - '"decision":"deny"'
      - '"decision":"continue"'
      - injectSteps
      stdout_not_contains:
      - allow_tool
      - deny_reason
      - additionalContext
- description: 'host contract: the retired env knobs no longer change any verdict'
  vars:
    scenario_id: host-contract-retired-env-knobs-inert
    kind: shell
    script: "BASE=\"$(ZV_EVENT=Stop ZV_ROLE=block ZV_TEXT=t node \"$ZENSU_PLUGIN_ROOT/hooks/antigravity/emit-verdict.js\"\
      )\"\nDRIFT=\"\"\nfor v in superset allow_tool decision exit; do\n  O=\"$(ZENSU_AG_HOOK_CONTRACT=\"$v\" ZV_EVENT=Stop\
      \ ZV_ROLE=block ZV_TEXT=t node \"$ZENSU_PLUGIN_ROOT/hooks/antigravity/emit-verdict.js\")\"\n  [ \"$O\" = \"\
      $BASE\" ] || DRIFT=\"$DRIFT CONTRACT=$v\"\ndone\nfor v in 0 1; do\n  O=\"$(ZENSU_AG_STOP_BLOCKS=\"$v\" ZV_EVENT=Stop\
      \ ZV_ROLE=block ZV_TEXT=t node \"$ZENSU_PLUGIN_ROOT/hooks/antigravity/emit-verdict.js\")\"\n  [ \"$O\" = \"\
      $BASE\" ] || DRIFT=\"$DRIFT STOP_BLOCKS=$v\"\ndone\n[ -n \"$DRIFT\" ] && echo \"KNOB-STILL-LIVE$DRIFT\" ||\
      \ echo \"KNOBS-INERT\"\n"
    expect:
      exit_code: 0
      stdout_contains:
      - KNOBS-INERT
      stdout_not_contains:
      - KNOB-STILL-LIVE
