- description: 'host contract: PreInvocation and Stop are declared FLAT, the shape the host can parse'
  vars:
    scenario_id: host-contract-flat-events-in-template
    kind: shell
    script: "node -e '\n  const fs = require(\"fs\");\n  const tpl = JSON.parse(fs.readFileSync(process.env.ZENSU_PLUGIN_ROOT\
      \ + \"/hooks.json.template\", \"utf8\"));\n  const want = new Map();\n  for (const line of fs.readFileSync(process.env.ZENSU_PLUGIN_ROOT\
      \ + \"/tests/fixtures/host-hook-events.txt\", \"utf8\").split(\"\\n\")) {\n    const m = line.trim().match(/^([A-Za-z]+)\\\
      s+(grouped|flat)$/);\n    if (m) want.set(m[1], m[2]);\n  }\n  if (!want.size) { console.log(\"FIXTURE-EMPTY\"\
      ); process.exit(0); }\n  const wrong = [];\n  for (const [group, events] of Object.entries(tpl)) {\n    for\
      \ (const [event, arr] of Object.entries(events || {})) {\n      if (!Array.isArray(arr)) continue;\n     \
      \ for (const e of arr) {\n        const seen = Array.isArray(e && e.hooks) ? \"grouped\" : (typeof (e || {}).command\
      \ === \"string\" ? \"flat\" : \"malformed\");\n        const expected = want.get(event);\n        if (!expected)\
      \ wrong.push(group + \"/\" + event + \":unknown-event\");\n        else if (seen !== expected) wrong.push(group\
      \ + \"/\" + event + \":\" + seen + \"!=\" + expected);\n      }\n    }\n  }\n  const entries = Object.values(tpl).reduce((n,\
      \ evs) => n + Object.values(evs || {}).reduce((m, a) => m + (Array.isArray(a) ? a.length : 0), 0), 0);\n \
      \ console.log(wrong.length ? \"STRUCTURE-WRONG \" + wrong.join(\" \") : \"STRUCTURE-OK entries=\" + entries);\n\
      '\n"
    expect:
      exit_code: 0
      stdout_contains:
      - STRUCTURE-OK entries=4
      stdout_not_contains:
      - STRUCTURE-WRONG
      - FIXTURE-EMPTY
- description: 'host contract: every rendered command names the event it is registered under'
  vars:
    scenario_id: host-contract-event-arg-matches-registration
    kind: shell
    script: "node -e '\n  const fs = require(\"fs\");\n  const tpl = JSON.parse(fs.readFileSync(process.env.ZENSU_PLUGIN_ROOT\
      \ + \"/hooks.json.template\", \"utf8\"));\n  const re = /antigravity-shim\\.sh\\s+(\\S+)\\s+(\\S+)\\s*$/;\n\
      \  const wrong = [];\n  let n = 0;\n  const check = (event, h) => {\n    n += 1;\n    const m = String((h\
      \ || {}).command || \"\").match(re);\n    if (!m) { wrong.push(event + \":no-event-token\"); return; }\n \
      \   if (m[2] !== event) wrong.push(m[1] + \":\" + m[2] + \"!=\" + event);\n  };\n  for (const events of Object.values(tpl))\n\
      \    for (const [event, arr] of Object.entries(events || {})) {\n      if (!Array.isArray(arr)) continue;\n\
      \      for (const e of arr) {\n        if (Array.isArray(e && e.hooks)) e.hooks.forEach(h => check(event,\
      \ h));\n        else check(event, e);\n      }\n    }\n  console.log(wrong.length ? \"EVENT-ARG-WRONG \" +\
      \ wrong.join(\" \") : \"EVENT-ARG-OK n=\" + n);\n'\n"
    expect:
      exit_code: 0
      stdout_contains:
      - EVENT-ARG-OK n=4
      stdout_not_contains:
      - EVENT-ARG-WRONG
- description: 'host contract: Stop says continue — the only value that blocks stopping'
  vars:
    scenario_id: host-contract-stop-says-continue
    kind: shell
    script: 'ZV_EVENT=Stop ZV_ROLE=block ZV_TEXT="chain incomplete" node "$ZENSU_PLUGIN_ROOT/hooks/antigravity/emit-verdict.js"

      '
    expect:
      exit_code: 0
      stdout_contains:
      - '"decision":"continue"'
      stdout_not_contains:
      - '"decision":"block"'
      - allow_tool
