- description: 'manifest: every skill directory on disk is registered in plugin.json'
  vars:
    scenario_id: manifest-skills-registered
    kind: shell
    script: |
      node -e '
        const fs=require("fs"),p=require("path");
        const root=process.env.ZENSU_PLUGIN_ROOT;
        const m=JSON.parse(fs.readFileSync(p.join(root,"plugin.json"),"utf8"));
        const listed=new Set((m.skills||[]).map(s=>p.basename(s)));
        const onDisk=fs.readdirSync(p.join(root,"skills"),{withFileTypes:true})
          .filter(d=>d.isDirectory()).map(d=>d.name);
        const missing=onDisk.filter(n=>!listed.has(n));
        const ghost=[...listed].filter(n=>!onDisk.includes(n));
        if(missing.length||ghost.length){
          console.log("UNREGISTERED="+missing.join(",")+" GHOST="+ghost.join(","));
          process.exit(1);
        }
        console.log("SKILLS_IN_SYNC count="+onDisk.length);
      '
    expect:
      exit_code: 0
      contains:
        - SKILLS_IN_SYNC
- description: 'manifest: every skill has the matching /zensu-<verb> command shim'
  vars:
    scenario_id: manifest-command-pairing
    kind: shell
    script: |
      node -e '
        const fs=require("fs"),p=require("path");
        const root=process.env.ZENSU_PLUGIN_ROOT;
        const skills=fs.readdirSync(p.join(root,"skills"),{withFileTypes:true})
          .filter(d=>d.isDirectory()).map(d=>d.name);
        const cmds=new Set(fs.readdirSync(p.join(root,"commands"))
          .filter(f=>f.endsWith(".md")).map(f=>f.replace(/\.md$/,"")));
        const orphans=skills.filter(s=>!cmds.has("zensu-"+s)&&!cmds.has(s));
        if(orphans.length){console.log("ORPHAN_SKILLS="+orphans.join(","));process.exit(1);}
        console.log("PAIRING_COMPLETE count="+skills.length);
      '
    expect:
      exit_code: 0
      contains:
        - PAIRING_COMPLETE
- description: 'manifest: native skill discovery covers every source command reference'
  vars:
    scenario_id: manifest-commands-registered
    kind: shell
    script: |
      node -e '
      const fs=require("fs"),p=require("path"),a=require("assert/strict");
      const root=process.env.ZENSU_PLUGIN_ROOT,m=require(p.join(root,"plugin.json"));
      a.equal(Object.hasOwn(m,"commands"),false);
      const native=m.skills.map(s=>p.basename(s)).map(s=>(s==="zensu-help"?s:"zensu-"+s)+".md").sort();
      const source=fs.readdirSync(p.join(root,"commands")).filter(f=>f.endsWith(".md")).sort();
      a.deepEqual(native,source);
      console.log("COMMANDS_IN_SYNC count="+native.length);
      '
    expect:
      exit_code: 0
      contains:
        - COMMANDS_IN_SYNC
- description: 'manifest: no key is declared that the host silently ignores'
  vars:
    scenario_id: manifest-no-ignored-keys
    kind: shell
    script: |
      node -e '
        const fs=require("fs"),p=require("path");
        const root=process.env.ZENSU_PLUGIN_ROOT;
        const m=JSON.parse(fs.readFileSync(p.join(root,"plugin.json"),"utf8"));
        // Single source of truth, shared with tests/structure/test-manifest-host-keys.sh.
        // Duplicating the list here would let the two drift silently.
        const spec=fs.readFileSync(p.join(root,"tests/fixtures/host-manifest-keys.txt"),"utf8");
        const allowed=new Set(spec.split("\n")
          .filter(l=>/^(component|metadata) /.test(l))
          .map(l=>l.split(/\s+/)[1]));
        if(allowed.size<5){console.log("KEYFILE_UNREADABLE");process.exit(1);}
        const unknown=Object.keys(m).filter(k=>!allowed.has(k));
        if(unknown.length){console.log("IGNORED_KEYS="+unknown.join(","));process.exit(1);}
        if(!Array.isArray(m.skills)||!m.skills.length){console.log("NO_SKILLS");process.exit(1);}
        console.log("MANIFEST_KEYS_HONEST skills="+m.skills.length);
      '
    expect:
      exit_code: 0
      contains:
        - MANIFEST_KEYS_HONEST
      not_contains:
        - IGNORED_KEYS
- description: 'manifest: native rules are present without unsupported component arrays'
  vars:
    scenario_id: manifest-no-inert-dirs
    kind: shell
    script: >
      cd "$ZENSU_PLUGIN_ROOT" || exit 1

      [ -f rules/AGENTS.md ] && [ ! -L rules/AGENTS.md ] || exit 1

      [ ! -e workflows ] || exit 1

      node -e 'const m=require("./plugin.json");
      if(Object.hasOwn(m,"rules")||Object.hasOwn(m,"workflows"))process.exit(1)'

      printf 'NATIVE_RULES_PRESENT\n'
    expect:
      exit_code: 0
      contains:
        - NATIVE_RULES_PRESENT
- description: 'manifest: native directory discovery retains all seven regular agent profiles'
  vars:
    scenario_id: manifest-agents-registered
    kind: shell
    script: |
      node -e '
      const fs=require("fs"),p=require("path"),a=require("assert/strict");
      const root=process.env.ZENSU_PLUGIN_ROOT,m=require(p.join(root,"plugin.json"));
      a.equal(Object.hasOwn(m,"agents"),false);
      const profiles=require(p.join(root,"hooks/antigravity/native-spawn-allow.js")).ownProfiles(root);
      a.equal(profiles.size,7);
      console.log("AGENTS_IN_SYNC count="+profiles.size);
      '
    expect:
      exit_code: 0
      contains:
        - AGENTS_IN_SYNC
- description: 'manifest: the plugin ships no MCP configuration of any kind'
  vars:
    scenario_id: manifest-no-mcp-config
    kind: shell
    script: |
      node -e '
        const fs=require("fs"),p=require("path");
        const root=process.env.ZENSU_PLUGIN_ROOT;
        const m=JSON.parse(fs.readFileSync(p.join(root,"plugin.json"),"utf8"));
        const keys=Object.keys(m).filter(k=>/mcp/i.test(k));
        const files=fs.readdirSync(root).filter(f=>/mcp/i.test(f));
        if(keys.length||files.length){
          console.log("MCP_LEAK keys="+keys.join(",")+" files="+files.join(","));
          process.exit(1);
        }
        console.log("NO_MCP_CONFIG");
      '
    expect:
      exit_code: 0
      contains:
        - NO_MCP_CONFIG
- description: 'manifest: every registered hook command points at a file that exists'
  vars:
    scenario_id: manifest-hooks-resolve
    kind: shell
    script: |
      node -e '
      const fs=require("fs"),p=require("path"),root=process.env.ZENSU_PLUGIN_ROOT;
      const rows=require(p.join(root,"tests/structure/antigravity-wiring.js")).inventory(root);
      const missing=rows.filter(row=>!fs.existsSync(p.join(root,"hooks",row.script)));
      if(missing.length||!rows.length)throw Error("missing engine handlers: "+JSON.stringify(missing));
      console.log("HOOKS_RESOLVE count="+new Set(rows.map(row=>row.script)).size);
      '
    expect:
      exit_code: 0
      contains:
        - HOOKS_RESOLVE
- description: 'manifest: runtime authority reads use neutral environment names'
  vars:
    scenario_id: manifest-standalone
    kind: shell
    script: |
      cd "$ZENSU_PLUGIN_ROOT" || exit 1
      # Runtime environment reads must use neutral names. Historical prose and
      # adversarial fixtures may name a foreign host without depending on it.
      if rg -l '\$\{?CLAUDE_(PLUGIN|PROJECT|SESSION|CODE)_' hooks --glob '*.sh'; then exit 1; fi
      if rg -l 'process[.]env[.]CLAUDE_' hooks --glob '*.js'; then exit 1; fi
      printf 'STANDALONE_CLEAN\n'
    expect:
      exit_code: 0
      contains:
        - STANDALONE_CLEAN
