- description: 'manifest: no key is declared that the host silently ignores'
  vars:
    scenario_id: manifest-no-ignored-keys
    kind: shell
    script: "node -e '\n  const fs=require(\"fs\"),p=require(\"path\");\n  const root=process.env.ZENSU_PLUGIN_ROOT;\n\
      \  const m=JSON.parse(fs.readFileSync(p.join(root,\"plugin.json\"),\"utf8\"));\n  // Single source of truth,\
      \ shared with tests/structure/test-manifest-host-keys.sh.\n  // Duplicating the list here would let the two\
      \ drift silently.\n  const spec=fs.readFileSync(p.join(root,\"tests/fixtures/host-manifest-keys.txt\"),\"\
      utf8\");\n  const allowed=new Set(spec.split(\"\\n\")\n    .filter(l=>/^(component|metadata) /.test(l))\n\
      \    .map(l=>l.split(/\\s+/)[1]));\n  if(allowed.size<5){console.log(\"KEYFILE_UNREADABLE\");process.exit(1);}\n\
      \  const unknown=Object.keys(m).filter(k=>!allowed.has(k));\n  if(unknown.length){console.log(\"IGNORED_KEYS=\"\
      +unknown.join(\",\"));process.exit(1);}\n  if(!Array.isArray(m.commands)||!m.commands.length){console.log(\"\
      NO_COMMANDS\");process.exit(1);}\n  console.log(\"MANIFEST_KEYS_HONEST commands=\"+m.commands.length);\n'\n"
    expect:
      exit_code: 0
      contains:
      - MANIFEST_KEYS_HONEST
      not_contains:
      - IGNORED_KEYS
- description: 'manifest: native rules are present without unsupported component arrays'
  vars:
    scenario_id: manifest-no-inert-dirs
    kind: shell
    script: |
      cd "$ZENSU_PLUGIN_ROOT" || exit 1
      [ -f rules/AGENTS.md ] && [ ! -L rules/AGENTS.md ] || exit 1
      [ ! -e workflows ] || exit 1
      node -e 'const m=require("./plugin.json"); if(Object.hasOwn(m,"rules")||Object.hasOwn(m,"workflows"))process.exit(1)'
      printf 'NATIVE_RULES_PRESENT\n'
    expect:
      exit_code: 0
      contains:
      - NATIVE_RULES_PRESENT
