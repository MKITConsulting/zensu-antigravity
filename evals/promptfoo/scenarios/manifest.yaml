- description: 'manifest: every skill directory on disk is registered in plugin.json'
  vars:
    scenario_id: manifest-skills-registered
    kind: shell
    script: "node -e '\n  const fs=require(\"fs\"),p=require(\"path\");\n  const root=process.env.ZENSU_PLUGIN_ROOT;\n\
      \  const m=JSON.parse(fs.readFileSync(p.join(root,\"plugin.json\"),\"utf8\"));\n  const listed=new Set((m.skills||[]).map(s=>p.basename(s)));\n\
      \  const onDisk=fs.readdirSync(p.join(root,\"skills\"),{withFileTypes:true})\n    .filter(d=>d.isDirectory()).map(d=>d.name);\n\
      \  const missing=onDisk.filter(n=>!listed.has(n));\n  const ghost=[...listed].filter(n=>!onDisk.includes(n));\n\
      \  if(missing.length||ghost.length){\n    console.log(\"UNREGISTERED=\"+missing.join(\",\")+\" GHOST=\"+ghost.join(\"\
      ,\"));\n    process.exit(1);\n  }\n  console.log(\"SKILLS_IN_SYNC count=\"+onDisk.length);\n'\n"
    expect:
      exit_code: 0
      contains:
      - SKILLS_IN_SYNC
- description: 'manifest: every skill has the matching /zensu-<verb> command shim'
  vars:
    scenario_id: manifest-command-pairing
    kind: shell
    script: "node -e '\n  const fs=require(\"fs\"),p=require(\"path\");\n  const root=process.env.ZENSU_PLUGIN_ROOT;\n\
      \  const skills=fs.readdirSync(p.join(root,\"skills\"),{withFileTypes:true})\n    .filter(d=>d.isDirectory()).map(d=>d.name);\n\
      \  const cmds=new Set(fs.readdirSync(p.join(root,\"commands\"))\n    .filter(f=>f.endsWith(\".md\")).map(f=>f.replace(/\\\
      .md$/,\"\")));\n  const orphans=skills.filter(s=>!cmds.has(\"zensu-\"+s)&&!cmds.has(s));\n  if(orphans.length){console.log(\"\
      ORPHAN_SKILLS=\"+orphans.join(\",\"));process.exit(1);}\n  console.log(\"PAIRING_COMPLETE count=\"+skills.length);\n\
      '\n"
    expect:
      exit_code: 0
      contains:
      - PAIRING_COMPLETE
