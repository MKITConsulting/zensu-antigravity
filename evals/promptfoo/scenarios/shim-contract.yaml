- description: 'shim: a PreToolUse deny speaks the host decision dialect and nothing else'
  vars:
    scenario_id: shim-pretooluse-deny-dialect
    kind: hook
    hook: pre-bash-zensu-gate.sh
    payload:
      toolCall:
        name: run_command
        args:
          CommandLine: zensu security classify f1 --classification confidential
          Cwd: __PROJECT__
      workspacePaths:
      - __PROJECT__
      session_id: pf-shim
    expect:
      exit_code: 0
      stdout_json:
        decision: deny
      stdout_not_contains:
      - '"allow_tool"'
      - '"deny_reason"'
      - hookSpecificOutput
- description: 'shim: a PreInvocation advisory travels as injectSteps, the only channel this host reads'
  vars:
    scenario_id: shim-preinvocation-injectsteps-dialect
    kind: hook
    hook: user-prompt-tdd-reminder.sh
    payload:
      prompt: add a slugify helper function to src/utils.ts
      workspacePaths:
      - __PROJECT__
      session_id: pf-shim-preinv
    expect:
      exit_code: 0
      stdout_contains:
      - injectSteps
      - ephemeralMessage
      stdout_not_contains:
      - '"additionalContext"'
      - '"allow_tool"'
      - '"decision"'
- description: 'shim: an unknown event fails safe with the empty verdict instead of guessing a shape'
  vars:
    scenario_id: shim-unknown-event-fails-safe
    kind: hook
    hook: pre-bash-zensu-gate.sh
    event: NotAnEvent
    payload:
      toolCall:
        name: run_command
        args:
          CommandLine: zensu security classify f1 --classification confidential
          Cwd: __PROJECT__
      workspacePaths:
      - __PROJECT__
      session_id: pf-shim
    expect:
      exit_code: 0
      stdout_contains:
      - '{}'
      stdout_not_contains:
      - '"decision"'
      - '"allow_tool"'
- description: 'shim: the shim always exits 0 so the host never sees a hook crash'
  vars:
    scenario_id: shim-always-exit-zero
    kind: hook
    hook: pre-bash-zensu-gate.sh
    payload: not json at all
    expect:
      exit_code: 0
- description: 'unbound tool call: malformed or empty authority fails closed'
  vars:
    scenario_id: shim-empty-payload-fails-closed
    kind: hook
    hook: pre-bash-zensu-gate.sh
    payload: ''
    expect:
      exit_code: 0
      stdout_json:
        decision: deny
      contains:
      - conversation
- description: 'shim: an unknown tool name is passed through untouched'
  vars:
    scenario_id: shim-unknown-tool-passthrough
    kind: hook
    hook: pre-bash-zensu-gate.sh
    payload:
      toolCall:
        name: some_future_tool
        args:
          Whatever: zensu features create --product p
      workspacePaths:
      - __PROJECT__
      session_id: pf-shim
    expect:
      exit_code: 0
      stdout_json:
        decision: ask
      stdout_not_contains:
      - '"deny"'
      - deny_reason
- description: 'shim: the workspace root reaches the gate as the project dir'
  vars:
    scenario_id: shim-workspace-root-propagates
    kind: shell
    script: "printf '{\"toolCall\":{\"name\":\"run_command\",\"args\":{\"CommandLine\":\"echo hi\",\"Cwd\":\"__PROJECT__\"\
      }},\"workspacePaths\":[\"__PROJECT__\"],\"session_id\":\"pf\"}' \\\n  | node \"$ZENSU_PLUGIN_ROOT/hooks/antigravity/normalize-payload.js\"\
      \n"
    expect:
      exit_code: 0
      contains:
      - Bash
      - echo hi
