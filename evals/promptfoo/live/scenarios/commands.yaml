# Every registered command is covered, plus an unknown-command control.
- description: 'live: /zensu-adopt-session resolves to its skill'
  vars:
    scenario_id: live-command-zensu-adopt-session
    probe: command
    command: zensu-adopt-session
    timeout_s: 100
    expect:
      stdout_contains_any:
      - RESOLVED zensu-adopt-session ->
      - LIVE-SKIPPED
      - LIVE-UNAVAILABLE
      stdout_not_contains:
      - UNRESOLVED
    expected_skill: adopt-session
